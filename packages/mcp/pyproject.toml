[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripilot-mcp"
version = "0.1.0"
description = "Standalone Agent-Native MCP Server for Tripilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
tripilot-mcp = "tripilot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["tripilot_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
