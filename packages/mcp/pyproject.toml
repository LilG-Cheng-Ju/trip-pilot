[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tripilot-mcp"
version = "0.7.2"
description = "Standalone Agent-Native MCP Server for Tripilot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0,<2.0.0",
]

[project.scripts]
tripilot-mcp = "tripilot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["tripilot_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
