<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <h1>{{ 'app.name' | t }}</h1>
    </div>

    <button
      type="button"
      class="locale-pill"
      (click)="i18n.toggleLocale()"
      [attr.aria-label]="'common.language' | t"
    >
      {{ i18n.locale() === 'en' ? '繁體中文' : 'EN' }}
    </button>
  </header>

  <main class="content">
    <section class="welcome-card">
      <p class="tagline">{{ 'app.tagline' | t }}</p>
      <div class="pill-row">
        <span class="pill">{{ 'nav.trips' | t }}</span>
        <span class="pill">{{ 'nav.itinerary' | t }}</span>
        <span class="pill">{{ 'nav.stats' | t }}</span>
        <span class="pill">{{ 'nav.profile' | t }}</span>
      </div>
    </section>

    <router-outlet />
  </main>
</div>
