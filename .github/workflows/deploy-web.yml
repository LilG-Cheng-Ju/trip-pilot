name: Deploy Web to Firebase Hosting

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Write cloud runtime-config.js from secret
        env:
          RUNTIME_CONFIG_JS: ${{ secrets.TRIPILOT_RUNTIME_CONFIG_JS }}
        run: |
          if [ -z "$RUNTIME_CONFIG_JS" ]; then
            echo "::error::Missing TRIPILOT_RUNTIME_CONFIG_JS repository secret."
            exit 1
          fi
          printf '%s\n' "$RUNTIME_CONFIG_JS" > public/runtime-config.js

      - name: Run unit tests and production build
        run: npx ng test --watch=false && npm run build

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: tripilot-515515
          entryPoint: apps/web
