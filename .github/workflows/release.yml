name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create or Update GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract release notes from releases.json
        id: extract
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node << 'EOF'
          const fs = require('node:fs');

          const tag = process.env.TAG || '';
          const version = tag.replace(/^v/, '');
          const prerelease = version.includes('-');
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8'));
          const entry = releases.find((item) => item.version === version);

          if (!entry) {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `has_notes=false\ntitle=${tag}\nprerelease=${prerelease}\n`,
            );
            process.exit(0);
          }

          const titleZh = String(entry.title['zh-TW']).replace(/[\r\n]+/g, ' ').trim();
          const titleEn = String(entry.title.en).replace(/[\r\n]+/g, ' ').trim();
          const releaseTitle = `${tag} — ${titleZh}`;

          const lines = [
            `## ${titleZh}`,
            `*${titleEn}*`,
            '',
            '### 繁體中文',
            ...entry.changes['zh-TW'].map((line) => `- ${line}`),
            '',
            '### English',
            ...entry.changes.en.map((line) => `- ${line}`),
            '',
            `Full changelog: [CHANGELOG.md](../../blob/${tag}/CHANGELOG.md)`,
            '',
          ];

          fs.writeFileSync('/tmp/release-notes.md', lines.join('\n'), 'utf8');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_notes=true\ntitle=${releaseTitle}\nprerelease=${prerelease}\n`,
          );
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TITLE: ${{ steps.extract.outputs.title }}
          HAS_NOTES: ${{ steps.extract.outputs.has_notes }}
          PRERELEASE: ${{ steps.extract.outputs.prerelease }}
        run: |
          args=(--title "$TITLE")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ "$HAS_NOTES" = "true" ]; then
            args+=(--notes-file /tmp/release-notes.md)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" "${args[@]}"
          else
            if [ "$HAS_NOTES" != "true" ]; then
              args+=(--generate-notes)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
