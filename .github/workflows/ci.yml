name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Backend API (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy app tests

      - name: Run pytest
        run: uv run pytest -q

      - name: Verify Alembic migrations
        run: |
          DATABASE_URL="sqlite+aiosqlite:///./ci_alembic.db" uv run alembic upgrade head
          rm -f ci_alembic.db

  mcp:
    name: MCP Package (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "packages/mcp/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy tripilot_mcp tests

      - name: Run pytest
        run: uv run pytest -q

  web:
    name: Frontend Web (ng test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lint, unit tests, and production build
        run: npm run lint && npx ng test --watch=false && npm run build
